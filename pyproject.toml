[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-recovery"
version = "0.1.0"
description = "Reproduce, detect, and recover from a stalled LangGraph support workflow."
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
loop-recovery = "agent_loop_recovery.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
